id: "respiratory_diagnosis_workflow"
name: "Respiratory Diagnosis and Treatment"
description: "Specialized workflow for respiratory cases"
version: "1.0.0"

steps:
  - id: "intake"
    name: "Patient Intake"
    type: "task"
    agent_type: "intake_agent"
    config:
      prioritize_respiratory_data: true

  - id: "specialized_diagnosis"
    name: "Respiratory Diagnosis"
    type: "task"
    agent_type: "custom_respiratory_diagnostic"
    
  - id: "general_diagnosis"
    name: "General Diagnosis"
    type: "task"
    agent_type: "diagnostic_agent"
    condition: "context.symptoms.contains('fever') || context.symptoms.contains('fatigue')"
    
  - id: "treatment"
    name: "Treatment Planning"
    type: "task"
    agent_type: "treatment_agent"
    config:
      include_respiratory_specialist_recommendations: true
      
  - id: "follow_up"
    name: "Follow-up Planning"
    type: "task"
    agent_type: "treatment_agent"
    config:
      mode: "follow_up"
      schedule_pulmonary_function_tests: true

connections:
  - from: "intake"
    to: "specialized_diagnosis"
  
  - from: "intake"
    to: "general_diagnosis"
    condition: "context.symptoms.contains('fever') || context.symptoms.contains('fatigue')"
  
  - from: "specialized_diagnosis"
    to: "treatment"
    
  - from: "general_diagnosis"
    to: "treatment"
    
  - from: "treatment"
    to: "follow_up"

input_schema: |
  {
    "type": "object",
    "properties": {
      "patient_data": {
        "type": "object",
        "properties": {
          "id": {"type": "string"},
          "name": {"type": "string"},
          "age": {"type": "number"},
          "gender": {"type": "string"},
          "symptoms": {"type": "array", "items": {"type": "string"}},
          "conditions": {"type": "array", "items": {"type": "string"}},
          "medications": {"type": "array", "items": {"type": "string"}},
          "vitals": {"type": "object"}
        },
        "required": ["id", "name", "age", "gender", "symptoms"]
      }
    },
    "required": ["patient_data"]
  }