id: "pediatric_assessment_workflow"
name: "Pediatric Assessment Workflow"
description: "Age-appropriate workflow for diagnosing and treating conditions in children"
version: "1.0.0"
author: "SwordSymphony Team"
tags: ["pediatric", "children", "development"]

steps:
  - id: "intake"
    name: "Pediatric Patient Data Intake"
    type: "task"
    agent_type: "intake_agent"
    
  - id: "diagnosis"
    name: "Pediatric Specialist Diagnosis"
    type: "task"
    agent_type: "pediatric_diagnostic"
    
  - id: "treatment"
    name: "Pediatric Treatment Planning"
    type: "task"
    agent_type: "treatment_agent"

connections:
  - from: "intake"
    to: "diagnosis"
  
  - from: "diagnosis"
    to: "treatment"

input_schema:
  type: "object"
  properties:
    patient_data:
      type: "object"
      properties:
        id:
          type: "string"
        name:
          type: "string"
        age:
          type: "number"
        gender:
          type: "string"
        symptoms:
          type: "array"
          items:
            type: "string"
        conditions:
          type: "array"
          items:
            type: "string"
        medications:
          type: "array"
          items:
            type: "string"
        vitals:
          type: "object"
        growth_metrics:
          type: "object"
        developmental_milestones:
          type: "object"
      required:
        - "id"
        - "name"
        - "age"
        - "gender"
        - "symptoms"
  required:
    - "patient_data"