id: "emergency_triage_workflow"
name: "Emergency Triage Workflow"
description: "Rapid assessment and treatment workflow for emergency medical conditions"
version: "1.0.0"
author: "SwordSymphony Team"
tags: ["emergency", "triage", "urgent"]

steps:
  - id: "intake"
    name: "Rapid Patient Data Intake"
    type: "task"
    agent_type: "intake_agent"
    timeoutSecs: 60
    
  - id: "diagnosis"
    name: "Emergency Triage Assessment"
    type: "task"
    agent_type: "emergency_diagnostic"
    timeoutSecs: 120
    
  - id: "treatment"
    name: "Immediate Treatment Planning"
    type: "task"
    agent_type: "treatment_agent"
    timeoutSecs: 60

connections:
  - from: "intake"
    to: "diagnosis"
  
  - from: "diagnosis"
    to: "treatment"

input_schema:
  type: "object"
  properties:
    patient_data:
      type: "object"
      properties:
        id:
          type: "string"
        name:
          type: "string"
        age:
          type: "number"
        gender:
          type: "string"
        symptoms:
          type: "array"
          items:
            type: "string"
        conditions:
          type: "array"
          items:
            type: "string"
        medications:
          type: "array"
          items:
            type: "string"
        vitals:
          type: "object"
        triage_level:
          type: "string"
          enum: ["immediate", "urgent", "delayed", "minimal"]
      required:
        - "id"
        - "name"
        - "age"
        - "gender"
        - "symptoms"
        - "vitals"
  required:
    - "patient_data"