id: "neurological_assessment_workflow"
name: "Neurological Assessment Workflow"
description: "Specialized workflow for diagnosing and treating neurological conditions"
version: "1.0.0"
author: "SwordSymphony Team"
tags: ["neurology", "brain", "nervous system", "specialist"]

steps:
  - id: "intake"
    name: "Patient Data Intake"
    type: "task"
    agent_type: "intake_agent"
    
  - id: "diagnosis"
    name: "Neurological Specialist Diagnosis"
    type: "task"
    agent_type: "neurologist_diagnostic"
    
  - id: "treatment"
    name: "Treatment Planning"
    type: "task"
    agent_type: "treatment_agent"

connections:
  - from: "intake"
    to: "diagnosis"
  
  - from: "diagnosis"
    to: "treatment"

input_schema:
  type: "object"
  properties:
    patient_data:
      type: "object"
      properties:
        id:
          type: "string"
        name:
          type: "string"
        age:
          type: "number"
        gender:
          type: "string"
        symptoms:
          type: "array"
          items:
            type: "string"
        conditions:
          type: "array"
          items:
            type: "string"
        medications:
          type: "array"
          items:
            type: "string"
        vitals:
          type: "object"
        neurological_tests:
          type: "object"
      required:
        - "id"
        - "name"
        - "age"
        - "gender"
        - "symptoms"
  required:
    - "patient_data"