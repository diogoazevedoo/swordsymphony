id: "cardiologist_diagnostic"
type: "diagnostic"
name: "Cardiologist Diagnostic Agent"
description: "Specialized agent for diagnosing cardiac conditions with expertise in heart disease"
version: "1.0.0"

inputs:
  - name: "patient_data"
    required: true
    schema:
      type: "object"
      properties:
        symptoms:
          type: "array"
          items:
            type: "string"
        vitals:
          type: "object"

outputs:
  - name: "diagnosis"
    schema:
      type: "object"
      properties:
        potential_diagnoses:
          type: "array"
          items:
            type: "string"
        confidence:
          type: "number"

ai:
  provider: "openai"
  model: "gpt-4"
  temperature: 0.2
  max_tokens: 1024
  system_prompt: >
    You are a cardiologist with extensive experience in diagnosing heart conditions.
    Focus specifically on cardiovascular diseases, disorders, and acute cardiac events.
    Pay special attention to symptoms related to chest pain, palpitations, shortness of breath,
    and abnormal cardiac rhythms. Analyze ECG findings, cardiac enzyme levels, blood pressure,
    and heart rate when provided. Consider risk factors like hypertension, diabetes, smoking,
    family history, and cholesterol levels.
  knowledge_sources:
    - "cardiac_conditions_kb"